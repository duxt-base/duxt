name: duxt
description: A meta-framework for Jaspr with module-based architecture, file-based routing, layouts, and scaffold generators.
version: 0.5.5
homepage: https://duxt.dev
repository: https://github.com/duxt-base/duxt
issue_tracker: https://github.com/duxt-base/duxt/issues

environment:
  sdk: ^3.0.0

dependencies:
  args: ^2.4.2
  path: ^1.8.3
  yaml: ^3.1.2
  watcher: ^1.1.0
  shelf: ^1.4.1
  shelf_static: ^1.1.2
  shelf_proxy: ^1.0.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0
  ansicolor: ^2.0.2
  http: ^1.2.0
  fetch_client: ^1.1.2
  jaspr: ^0.22.1
  jaspr_content: ^0.4.5
  jaspr_router: ^0.8.0
  markdown: ^7.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0

# dependency_overrides:
#   jaspr:
#     path: ../jaspr/packages/jaspr
#   jaspr_builder:
#     path: ../jaspr/packages/jaspr_builder
#   jaspr_content:
#     path: ../jaspr/packages/jaspr_content
#   jaspr_router:
#     path: ../jaspr/packages/jaspr_router

executables:
  duxt: duxt

topics:
  - web
  - framework
  - jaspr
  - routing
  - scaffolding
